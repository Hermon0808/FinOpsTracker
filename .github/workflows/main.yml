name: Local CI-CD Pipeline

# Required permissions for GHCR
permissions:
  contents: read
  packages: write

on:
  push:
    branches: [ main ]

jobs:
  test:
    name: Run Unit Tests
    runs-on: self-hosted
    defaults:
      run:
        shell: pwsh  # Use PowerShell Core (more reliable on Windows)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'  # Let setup-python pick latest 3.9.x
          architecture: 'x64'
          cache: 'pip'  # Cache pip dependencies
        # Retry on failure (common on self-hosted)
        continue-on-error: false

      - name: Debug Python Setup
        run: |
          python --version
          pip --version
          Get-Command python

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt --verbose

      - name: Run tests
        run: |
          pytest -v

  build-and-push:
    name: Build and Push Docker Image
    runs-on: self-hosted
    needs: test
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/hermon0808/finopstracker:latest
          # Optional: cache to speed up builds
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Local Docker Swarm
    runs-on: self-hosted
    needs: build-and-push
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Deploy with Terraform
        run: |
          $projectPath = "C:\Users\Asus\Desktop\my-devops-project-main\terraform"
          if (-not (Test-Path $projectPath)) {
            Write-Error "Terraform directory not found: $projectPath"
            exit 1
          }
          Set-Location $projectPath
          terraform init -upgrade
          terraform validate
          terraform apply -auto-approve -input=false
        env:
          # Pass any needed vars (e.g., for Docker Swarm)
          TF_VAR_image_tag: ghcr.io/hermon0808/finopstracker:latest